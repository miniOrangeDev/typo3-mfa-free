<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Factor Authentication - {method -> f:format.case(mode: 'capital')}</title>
    
    <f:asset.css identifier="twofactor-styles" href="EXT:mfa/Resources/Public/Css/TwoFactor.css" />
    <f:asset.script identifier="twofactor-script" src="EXT:mfa/Resources/Public/JavaScript/TwoFactor.js" />
    
    <style>
        /* TYPO3 v13 Compatible Critical CSS */
        .mo-2fa-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .mo-2fa-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 2rem;
            width: 100%;
            max-width: 420px;
            position: relative;
        }
        
        .mo-2fa-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .mo-2fa-header h1 {
            color: #1a202c;
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0 0 0.5rem 0;
        }
        
        .mo-2fa-header p {
            color: #718096;
            margin: 0;
        }
        
        .mo-navigation {
            position: absolute;
            top: 1rem;
            left: 1rem;
            right: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .mo-back-btn, .mo-help-btn {
            background: none;
            border: none;
            color: #667eea;
            text-decoration: none;
            font-size: 0.875rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 6px;
            transition: background-color 0.2s;
        }
        
        .mo-back-btn:hover, .mo-help-btn:hover {
            background-color: #f7fafc;
        }
    </style>
</head>
<body>
    <div class="mo-2fa-container">
        <div class="mo-2fa-card">
            <!-- Navigation -->
            <div class="mo-navigation">
                <f:link.action action="show" class="mo-back-btn">← Back</f:link.action>
                <a href="#" class="mo-help-btn" onclick="toggleHelp()">Help?</a>
            </div>
            
            <!-- Main Content -->
            <div class="mo-2fa-content">
                <f:flashMessages />
                <f:render section="Main" />
            </div>
            
            <!-- Help Modal -->
            <div id="helpModal" class="mo-help-modal" style="display: none;">
                <div class="mo-help-content">
                    <h3>Need Help?</h3>
                    <p>Contact your system administrator for assistance with two-factor authentication.</p>
                    <button onclick="toggleHelp()">Close</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function toggleHelp() {
            const modal = document.getElementById('helpModal');
            modal.style.display = modal.style.display === 'none' ? 'block' : 'none';
        }
    </script>
</body>
</html>
