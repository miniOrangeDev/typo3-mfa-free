<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2FA Verification</title>
    <style>
     .twofa-container {
   width: 30%;
  max-width: 90%;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  padding: 1rem;
  font-family: 'Segoe UI', Arial, sans-serif;
  text-align: center;
}

.twofa-back {
  color: #ff9100;
  text-decoration: none;
  font-size: 1rem;
  display: block;
  margin-bottom: 18px;
  font-weight: 500;
  text-align: left;
  position: absolute;
  top: 1rem;
  left: 1rem;
}

.twofa-title {
  font-weight: 700;
  font-size: 1.6rem ;
  margin-bottom: 8px;
  margin-top: 3rem;
}

.twofa-subtitle {
  color: #666;
}

.twofa-methods {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-bottom: 28px;
}

.twofa-method {
  display: flex;
  align-items: center;
  padding: 14px 0 14px 0;
  border-bottom: 1px solid #eee;
  cursor: pointer;
  transition: background 0.12s;
  position: relative;
  padding-left: 1rem;
}

.twofa-method:last-child {
  border-bottom: none;
}

.twofa-method:hover {
  background: #f8f8f8;
}

.twofa-icon {
  font-size: 1.7rem;
  color: #444;
  margin-right: 18px;
  min-width: 32px;
  text-align: center;
}

.twofa-method-title {
  font-size: 1.08rem;
  font-weight: 500;
  color: #222;
  text-align: left;
}

.twofa-method-desc {
  font-size: 0.97rem;
  color: #888;
  text-align: left;
}

.twofa-confirm-btn {
  width: 100%;
  background: #ff9100;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 1.13rem;
  font-weight: 600;
  padding: 13px 0;
  margin-top: 18px;
  cursor: pointer;
  transition: background 0.15s;
  box-shadow: 0 2px 8px rgba(255,145,0,0.08);
}

.twofa-confirm-btn:hover {
  background: #ff9800;
}

/* Hide radio buttons but keep them functional */
.twofa-method input[type="radio"] {
  position: absolute;
  opacity: 0;
  pointer-events: none;
  padding-left: 1rem;
}

/* Selected state styling */
.twofa-method.selected {
  background: #fff3e0;
  border-radius: 8px;
  padding-left: 1rem;
  box-shadow: 0 2px 8px rgba(255,145,0,0.08);
}

.twofa-method.selected .twofa-icon {
  color: #ff9100;
}

.twofa-method.selected .twofa-method-title {
  color: #ff9100;
  font-weight: 600;
}
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Back Button at Top Left -->
      <f:form action="submit" controller="OtpAuthentication" extensionName="Mfa" pluginName="OtpAuthentication" method="post" id="emailForm">
        <!-- Capture email from URL parameter using JavaScript -->
        <input type="hidden" name="email" id="emailField" value="" />
        
        <!-- Alternative: If email is passed from controller -->
        <f:form.hidden name="email" id="email" value="" />

        <div class="twofa-container">
          <a href="/" class="twofa-back"><i class="fa fa-arrow-left"></i> Back</a>
          <h1 class="twofa-title">Two-Factor Authentication</h1>
          <p class="twofa-subtitle">Choose one of these methods to log in</p>
          <f:if condition="{error}">
            <div style="background:#ffeaea;color:#b71c1c;padding:12px 18px;border-radius:6px;margin-bottom:18px;">{error}</div>
          </f:if>
          <div class="twofa-methods">
            <f:for each="{enabledMethods}" as="method">
               <f:switch expression="{method}">
                 <f:case value="EMAIL">
                   <div class="twofa-method" onclick="selectMethod('method-email')">
                     <f:form.radio name="method" value="email" id="method-email" additionalAttributes="{required: 'required'}" />
                     <label for="method-email" style="display:flex;align-items:center;cursor:pointer;width:100%;margin-bottom:0;">
                       <i class="fa fa-envelope twofa-icon"></i>
                       <div>
                         <div class="twofa-method-title">Email</div>
                         <div class="twofa-method-desc">Send OTP to your email</div>
                       </div>
                     </label>
                   </div>
                 </f:case>
                 <f:case value="SMS">
                   <div class="twofa-method" onclick="selectMethod('method-sms')">
                     <f:form.radio name="method" value="sms" id="method-sms" />
                     <label for="method-sms" style="display:flex;align-items:center;cursor:pointer;width:100%;margin-bottom:0;">
                       <i class="fa fa-mobile-alt twofa-icon"></i>
                       <div>
                         <div class="twofa-method-title">SMS</div>
                         <div class="twofa-method-desc">Send an SMS code to ***-***-5599</div>
                       </div>
                     </label>
                   </div>
                 </f:case>
                 <f:case value="SMS_EMAIL">
                  <div class="twofa-method" onclick="selectMethod('method-sms_email')">
                    <f:form.radio name="method" value="sms_email" id="method-sms_email" />
                    <label for="method-sms_email" style="display:flex;align-items:center;cursor:pointer;width:100%;margin-bottom:0;">
                      <i class="fa fa-envelope twofa-icon"></i>
                      <div>
                        <div class="twofa-method-title">Email and SMS</div>
                        <div class="twofa-method-desc">Send OTP to your email and SMS</div>
                      </div>
                    </label>
                  </div>
                 </f:case>
                 <f:case value="GOOGLE">
                  <div class="twofa-method" onclick="selectMethod('method-google')">
                    <f:form.radio name="method" value="google" id="method-google" />
                    <label for="method-google" style="display:flex;align-items:center;cursor:pointer;width:100%;margin-bottom:0;">
                      <i class="fa-brands fa-google twofa-icon"></i>
                      <div>
                        <div class="twofa-method-title">Google Authenticator</div>
                        <div class="twofa-method-desc">Authenticator App</div>
                      </div>
                    </label>
                  </div>
                </f:case>
                <f:case value="MICROSOFT">
                  <div class="twofa-method" onclick="selectMethod('method-microsoft')">
                    <f:form.radio name="method" value="microsoft" id="method-microsoft" />
                    <label for="method-microsoft" style="display:flex;align-items:center;cursor:pointer;width:100%;margin-bottom:0;">
                      <i class="fa-brands fa-microsoft twofa-icon"></i>
                      <div>
                        <div class="twofa-method-title">Microsoft Authenticator</div>
                        <div class="twofa-method-desc">Authenticator App</div>
                      </div>
                    </label>
                  </div>
                </f:case>
               </f:switch>
             </f:for>
          </div>
          <button class="twofa-confirm-btn">Confirm Selection</button>
        </div>
      </f:form>
    </div>
  
    <!-- JavaScript for Button Actions -->
    <script>
        // Get email from URL parameters and set it in the hidden field
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            var results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }
        
        // Set email from URL parameter on page load
        document.addEventListener('DOMContentLoaded', function() {
            var email = getUrlParameter('email');
            if (email) {
                document.getElementById('emailField').value = email;
            }
        });
        
        // Method selection function
        function selectMethod(methodId) {
            // Remove selected class from all methods
            document.querySelectorAll('.twofa-method').forEach(function(method) {
                method.classList.remove('selected');
            });
            
            // Find the method container by looking for the div that contains the radio button with the given ID
            const radioButton = document.getElementById(methodId);
            if (radioButton) {
                // Find the parent .twofa-method div
                const selectedMethod = radioButton.closest('.twofa-method');
                if (selectedMethod) {
                    selectedMethod.classList.add('selected');
                }
                radioButton.checked = true;
            }
        }
        
        // Combine the code digits before form submission
        document.querySelector('form').addEventListener('submit', function(e) {
          const digits = Array.from(document.querySelectorAll('.input-group input[type="text"]'))
            .map(input => input.value)
            .join('');
          
          document.getElementById('combinedCode').value = digits;
        });
        
        // Auto-focus and auto-tab between inputs
        document.querySelectorAll('.input-group input').forEach((input, index, inputs) => {
          input.addEventListener('input', function() {
            if (this.value.length === 1 && index < inputs.length - 1) {
              inputs[index + 1].focus();
            }
          });
          
          input.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace' && this.value.length === 0 && index > 0) {
              inputs[index - 1].focus();
            }
          });
        });
        
        // Back button functionality
        function goBack() {
            window.history.back();
        }
        
        // Contact admin functionality
        function contactAdmin() {
            // Implement contact admin logic here
            alert('Contact admin functionality to be implemented');
        }

        // On form submit, merge all otp fields into hidden input
  document.getElementById('emailForm').addEventListener('submit', function(e) {
    // fetch email from url parameter email
    var email = getUrlParameter('email');

    
    document.getElementById('email').value = email;
    // Optionally, you can validate length here if needed
  });
      </script>
  </body>
  </html>
