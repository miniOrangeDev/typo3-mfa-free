<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2FA Verification</title>
    <style>
     .twofa-container {
   width: 30%;
  max-width: 90%;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  padding: 1rem;
  font-family: 'Segoe UI', Arial, sans-serif;
  text-align: center;
}

.form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .form-input:disabled {
            background-color: #f5f5f5;
            color: #666;
            cursor: not-allowed;
        }

        .form-input:focus {
            outline: none;
            border-color: #ff9100;
            box-shadow: 0 0 0 2px rgba(255, 145, 0, 0.2);
        }

        .phone-input-group {
            display: flex;
            gap: 10px;
        }

        .country-code {
            width: 30%;
            flex-shrink: 0;
        }

        .phone-number {
            flex: 1;
        }
.phone-input-group {
            display: flex;
            gap: 10px;
            margin-top: 4rem;
    margin-bottom: 1rem;
        }

        .phone-input-group {
            display: flex;
            gap: 10px;
        }

        .country-code {
            width: 30%;
            flex-shrink: 0;
        }

        .phone-number {
            flex: 1;
        }

.twofa-back {
  color: #ff9100;
  text-decoration: none;
  font-size: 1rem;
  display: block;
  font-weight: 500;
  text-align: left;
  position: absolute;
  top: 1rem;
  left: 1rem;
}

.twofa-title {
  font-weight: 700;
  font-size: 1.6rem ;
  margin-bottom: 8px;
  margin-top: 3rem;
}

.twofa-subtitle {
  color: #666;
}

.twofa-methods {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-bottom: 28px;
}

.twofa-method {
  display: flex;
  align-items: center;
  padding: 14px 0 14px 0;
  border-bottom: 1px solid #eee;
  cursor: pointer;
  transition: background 0.12s;
}

.twofa-method:last-child {
  border-bottom: none;
}

.twofa-method:hover {
  background: #f8f8f8;
}

.twofa-icon {
  font-size: 1.7rem;
  color: #444;
  margin-right: 18px;
  min-width: 32px;
  text-align: center;
}

.twofa-method-title {
  font-size: 1.08rem;
  font-weight: 500;
  color: #222;
  text-align: left;
}

.twofa-method-desc {
  font-size: 0.97rem;
  color: #888;
  text-align: left;
}

.twofa-confirm-btn {
  width: 100%;
  background: #ff9100;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 1.13rem;
  font-weight: 600;
  padding: 13px 0;
  margin-top: 18px;
  cursor: pointer;
  transition: background 0.15s;
  box-shadow: 0 2px 8px rgba(255,145,0,0.08);
}

.twofa-confirm-btn:hover {
  background: #ff9800;
}
.twofa-method.selected,
.twofa-method input[type="radio"]:checked + label {
  background: #fff3e0;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(255,145,0,0.08);
}


    </style>
  </head>
<div class="twofa-container">
  <f:if condition="{backToLogin}">
    <f:then>
      <a href="/" class="twofa-back"><i class="fa fa-arrow-left"></i> Back</a>
    </f:then>
    <f:else>
      <f:link.action action="show" controller="OtpAuthentication" extensionName="Mfa" pluginName="OtpAuthentication" arguments="{method: backMethod}" class="twofa-back"><i class="fa fa-arrow-left"></i> Back</f:link.action>
    </f:else>
  </f:if>
  <h1 class="twofa-title">Two-Factor Authentication</h1>
  <p class="twofa-subtitle">To secure your account, please provide your phone number for two-factor authentication.</p>
  <f:if condition="{error}">
    <div style="background:#ffeaea;color:#b71c1c;padding:12px 18px;border-radius:6px;margin-bottom:18px;">{error}</div>
  </f:if>
  <f:form action="sendOtpSms" controller="OtpAuthentication" extensionName="Mfa" pluginName="OtpAuthentication" method="post">
    <input type="hidden" name="method" value="sms_phone" />
    <f:form.hidden name="user_pid" value="{user_pid}" />
    <f:form.hidden name="email" value="{email}" />
    <f:form.hidden name="otp_length" value="{otp_length}" />
    <div class="phone-input-group">
      <f:form.select name="countryCode" options="{
          '+1': 'USA +1',
          '+44': 'UK +44',
          '+91': 'India +91',
          '+86': 'China +86',
          '+81': 'Japan +81',
          '+49': 'Germany +49',
          '+33': 'France +33',
          '+39': 'Italy +39',
          '+34': 'Spain +34',
          '+7': 'Russia +7',
          '+55': 'Brazil +55',
          '+52': 'Mexico +52',
          '+54': 'Argentina +54',
          '+27': 'South Africa +27',
          '+61': 'Australia +61',
          '+31': 'Netherlands +31',
          '+32': 'Belgium +32',
          '+46': 'Sweden +46',
          '+47': 'Norway +47',
          '+45': 'Denmark +45',
          '+358': 'Finland +358',
          '+48': 'Poland +48',
          '+420': 'Czech Republic +420',
          '+36': 'Hungary +36',
          '+30': 'Greece +30',
          '+351': 'Portugal +351',
          '+353': 'Ireland +353',
          '+372': 'Estonia +372',
          '+371': 'Latvia +371',
          '+370': 'Lithuania +370',
          '+421': 'Slovakia +421',
          '+386': 'Slovenia +386',
          '+385': 'Croatia +385',
          '+40': 'Romania +40',
          '+359': 'Bulgaria +359',
          '+380': 'Ukraine +380',
          '+375': 'Belarus +375'
      }" class="form-input country-code" />
        <f:form.textfield name="phone" class="form-input phone-number" placeholder="Enter phone number" required="required" />
    </div>
    <button class="twofa-confirm-btn" type="submit">Send OTP</button>
  </f:form>
</div>
